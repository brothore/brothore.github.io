<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="白杨的技术博客，记录开发实验、技术短记和深入思考。">
  <title>白杨 · 技术与思考</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; color: #243042; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.8; }
    main { max-width: 780px; margin: 0 auto; padding: 64px 24px; }
    header { margin-bottom: 40px; }
    h1 { margin: 0; font-size: 38px; letter-spacing: 2px; }
    header p { color: #64748b; }
    .label { color: #2563eb; font-size: 14px; }
    article { margin: 20px 0; padding: 28px; background: white; border: 1px solid #e5e9f0; border-radius: 16px; }
    h2 { margin: 12px 0; font-size: 23px; }
    article p { margin-bottom: 0; }
    time, footer { color: #64748b; font-size: 14px; }
    footer { margin-top: 40px; }
    @media (max-width: 480px) { main { padding: 36px 18px; } article { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="label">技术 · 实验 · 思考</span>
      <h1>白杨</h1>
      <p>在这里记录开发中的发现，也把值得深入的问题慢慢想清楚。</p>
    </header>
    <article>
      <span class="label">短记</span> · <time datetime="2026-10-14">2026 年 10 月 14 日</time>
      <h2>博客，从这里开始</h2>
      <p>给技术思考留一个地方。小发现写成短记，完整的探索写成长文，边做边记录。</p>
    </article>
    <article>
      <span class="label">长文 · 准备中</span>
      <h2>从问题出发，记录一次完整的探索</h2>
      <p>这里将分享项目实践、技术方案的取舍，以及实验中的结果与思考。</p>
    </article>
    <footer>© 2026 白杨</footer>
  </main>
</body>
</html>
